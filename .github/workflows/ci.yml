name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "::notice::Firebase ON (google-services.json written from secret)"
          else
            echo "::notice::Firebase OFF: add the GOOGLE_SERVICES_JSON secret to switch it on"
          fi

      - name: Build, test, lint
        run: ./gradlew --stacktrace testStandardDebugUnitTest assembleStandardDebug assembleWithSmsDebug lintStandardDebug lintWithSmsDebug

      - name: Database schema unchanged (or bumped with a migration)
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --porcelain -- app/schemas
            echo "::error::The Room schema changed. Bump AppDatabase.version, add a migration (AutoMigration or Migration) so phones keep their data, and commit app/schemas."
            exit 1
          fi

      - name: Main APK has no permission that Google Play Protect blocks
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/standard/debug/*.apk | head -1)
          if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "READ_SMS|RECEIVE_SMS|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE"; then
            echo "::error::EasyLife.apk (standard) must not ask for SMS, notification or accessibility access: Play Protect blocks it. Put it in src/withSms."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: easylife-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          retention-days: 7

  functions:
    name: Cloud Functions build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check for functions
        id: check
        run: echo "present=$([ -f firebase/functions/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.check.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - name: Install, build, test
        if: steps.check.outputs.present == 'true'
        working-directory: firebase/functions
        run: |
          npm ci
          npm run build
          npm test
      - name: Remote Config template matches the app's bundled defaults
        if: steps.check.outputs.present == 'true'
        run: node firebase/scripts/build-remoteconfig.mjs --check
      - uses: actions/setup-java@v6
        if: steps.check.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Firestore security rules on the emulator
        if: steps.check.outputs.present == 'true'
        working-directory: firebase
        run: npx --yes firebase-tools@15.33.0 emulators:exec --only firestore --project demo-easylife "npm --prefix functions run test:rules"
