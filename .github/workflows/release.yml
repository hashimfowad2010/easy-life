name: Release

# Push a tag like v0.1.0 to build a signed APK and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "FIREBASE_STATE=ON" >> "$GITHUB_ENV"
          else
            echo "FIREBASE_STATE=OFF (GOOGLE_SERVICES_JSON secret not set yet)" >> "$GITHUB_ENV"
          fi

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.EASYLIFE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::EASYLIFE_KEYSTORE_BASE64 secret missing"; exit 1; fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/easylife-release.p12"

      - name: Unit tests and signed release build
        env:
          EASYLIFE_VERSION_NAME: ${{ github.ref_name }}
          EASYLIFE_KEYSTORE_PATH: ${{ runner.temp }}/easylife-release.p12
          EASYLIFE_KEYSTORE_PASSWORD: ${{ secrets.EASYLIFE_KEYSTORE_PASSWORD }}
          EASYLIFE_KEY_ALIAS: ${{ secrets.EASYLIFE_KEY_ALIAS }}
          EASYLIFE_KEY_PASSWORD: ${{ secrets.EASYLIFE_KEY_PASSWORD }}
        run: ./gradlew --stacktrace testReleaseUnitTest assembleRelease

      - name: Verify signature and name the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signature.txt
          grep -q "CN=Easy Life" signature.txt || { echo "::error::APK is not signed with the Easy Life release key"; exit 1; }
          OUT="EasyLife-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$OUT"
          # Constant name too, so .../releases/latest/download/EasyLife.apk always works (easy to share).
          cp "$APK" EasyLife.apk
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h "$OUT" | cut -f1)" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          {
            if [ -f "$NOTES" ]; then cat "$NOTES"; else echo "Release ${GITHUB_REF_NAME}"; fi
            echo
            echo "---"
            echo "**Install:** download \`${APK_FILE}\` (${APK_SIZE}) on your Android phone, open it, and allow \"Install unknown apps\" for your browser or Files app when asked."
            echo
            echo "Build: commit \`${GITHUB_SHA::7}\` · Firebase: ${FIREBASE_STATE}"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK_FILE" EasyLife.apk "$APK_FILE.sha256" \
            --title "Easy Life ${GITHUB_REF_NAME}" --notes-file notes.md --latest
