name: Emulator smoke test

# Runs the app on an Android emulator: onboarding, demo data, every main screen in English and Urdu,
# a sample scan. Catches crashes before a release and saves screenshots for the README.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The test APK is kept installed (-Pandroid.injected.androidTest.leaveApksInstalledAfterRun) so files can be pulled.
          script: |
            ./gradlew --no-configuration-cache connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > test-output.txt 2>&1; echo $? > test-exit.txt
            mkdir -p screenshots && adb pull /sdcard/Android/data/com.easylife.app.debug/files/screenshots/. screenshots/ || true
            adb logcat -d > screenshots/logcat.txt || true
            tail -60 test-output.txt; grep -E "AndroidRuntime|FATAL" screenshots/logcat.txt | tail -50 || true
            exit $(cat test-exit.txt)

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            screenshots/
            app/build/outputs/connected_android_test_additional_output/
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: app/build/reports/androidTests/
          retention-days: 7
